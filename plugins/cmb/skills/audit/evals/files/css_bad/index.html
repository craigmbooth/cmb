<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="margin:0;background:#f4f4f4;font-family:Arial">
  <header style="background:#1a73e8;color:#ffffff;padding:16px;height:64px">
    <h1 style="font-size:22px;color:#ffffff;margin:0">Dashboard</h1>
  </header>
  <main style="padding:24px">
    <div style="background:#ffffff;border:1px solid #dddddd;border-radius:4px;padding:13px;margin-bottom:12px">
      <span style="color:#1a73e8;font-size:14px">Revenue</span>
      <p style="color:#333333;font-size:28px;margin:6px 0">$12,400</p>
    </div>
    <button style="background:#1a73e8;color:#fff;border:none;padding:10px 18px;border-radius:4px;font-size:15px">Refresh</button>
  </main>
</body>
</html>
